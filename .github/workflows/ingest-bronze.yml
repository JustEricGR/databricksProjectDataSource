name: Trigger Databricks Bronze Ingestion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/**'

jobs:
  trigger-databricks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'data/')
          echo "Changed files in data/: $CHANGED"
          echo "changed=${CHANGED}" >> $GITHUB_OUTPUT

      - name: Trigger Databricks Job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
        run: |
          echo "Triggering Databricks job ID: $DATABRICKS_JOB_ID"
          echo "Host: $DATABRICKS_HOST"
          RESPONSE=$(curl -s -w "\n__HTTP_STATUS__%{http_code}" -X POST \
            "${DATABRICKS_HOST}/api/2.1/jobs/runs/now" \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"job_id\": ${DATABRICKS_JOB_ID},
              \"notebook_params\": {
                \"commit_sha\": \"${{ github.sha }}\",
                \"changed_files\": \"${{ steps.detect.outputs.changed }}\"
              }
            }" 2>&1)
          HTTP_STATUS=$(echo "$RESPONSE" | grep "__HTTP_STATUS__" | sed 's/__HTTP_STATUS__//')
          BODY=$(echo "$RESPONSE" | grep -v "__HTTP_STATUS__")
          echo "HTTP Status: $HTTP_STATUS"
          echo "Databricks response: $BODY"
          RESPONSE="$BODY"
          RUN_ID=$(echo $RESPONSE | jq -r '.run_id // "null"')
          echo "Run ID: $RUN_ID"
          if [ "$RUN_ID" = "null" ]; then
            echo "ERROR: Job was not triggered. Check the response above."
            exit 1
          fi
