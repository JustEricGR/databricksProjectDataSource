name: Trigger Databricks Bronze Ingestion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/**'

jobs:
  trigger-databricks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Detect changed files
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'data/')
          echo "Changed files in data/: $CHANGED"
          echo "changed=${CHANGED}" >> $GITHUB_OUTPUT

      - name: Trigger Databricks Job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks jobs run-now \
            --job-id ${{ secrets.DATABRICKS_JOB_ID }} \
            --notebook-params "{\"commit_sha\":\"${{ github.sha }}\",\"changed_files\":\"${{ steps.detect.outputs.changed }}\"}"
